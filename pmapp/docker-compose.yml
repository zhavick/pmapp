services:
  postgres:
    image: postgres:16-alpine
    container_name: pmapp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pmapp_dev_password
      POSTGRES_DB: pmapp_dev
    ports:
      - "5432:5432"
    volumes:
      - pmapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pmapp_pgdata:
